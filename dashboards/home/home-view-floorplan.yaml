type: sections
title: All
icon: mdi:lightbulb
path: floor-plan

max_columns: 2
dense_section_placement: true
theme: floorplan_view

badges:
  - type: entity
    entity: sensor.lights_on
    tap_action:
      action: perform-action
      perform_action: script.turn_off_active_lights
      target:
        entity_id: light.all_lights

