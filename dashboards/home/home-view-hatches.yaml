type: sections
title: Hatches
icon: mdi:door
path: hatches

max_columns: 4
theme: standard-dashboard

sections:
  - type: grid
    column_span: 4
    cards:
      - type: vertical-stack
        cards:
          - type: heading
            heading: Hatches
          - type: tile
            entity: cover.1st_floor_roof_hatch_246
            features:
              - type: cover-position
          - type: tile
            entity: cover.kitchen_hatch
            vertical: false
            features:
              - type: cover-position
            features_position: bottom
          - type: tile
            entity: cover.extension_lantern_hatch
            vertical: false
            features:
              - type: cover-position
            features_position: bottom
      - type: vertical-stack
        cards:
          - type: heading
            heading: A/C Units
          - type: tile
            entity: climate.ac_bedroom
            name: Bedroom A/C
            tap_action:
              action: fire-dom-event
              popup_card:
                title: Bedroom A/C
                content:
                  type: custom:aircon-control-card
                  entity: climate.ac_bedroom
          - type: tile
            entity: climate.ac_cinema
            name: Cinema A/C
            tap_action:
              action: fire-dom-event
              popup_card:
                title: Cinema A/C
                content:
                  type: custom:aircon-control-card
                  entity: climate.ac_cinema
          - type: tile
            entity: climate.ac_mezzanine
            name: Mezzanine A/C
            tap_action:
              action: fire-dom-event
              popup_card:
                title: Mezzanine A/C
                content:
                  type: custom:aircon-control-card
                  entity: climate.ac_mezzanine
                  fan_entity: fan.ac_mezzanine
                  power_entity: switch.ac_mezzanine_power