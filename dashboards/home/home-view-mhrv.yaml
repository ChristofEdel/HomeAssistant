type: sections
title: MHRV
icon: mdi:hvac
path: mhrv

max_columns: 2
theme: standard-dashboard

sections:
  - type: grid
    cards:
      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: sensor.mhrv_intake_temperature
            name: Intake
            icon: mdi:home-import-outline
            grid_options:
              columns: 4
              min_columns: 4
          - type: tile
            entity: sensor.mhrv_supply_temperature
            name: Supply
            icon: mdi:import
            grid_options:
              columns: 4
              min_columns: 4
          - type: tile
            entity: sensor.mhrv_gain
            name: Gain
            grid_options:
              columns: 4
              min_columns: 4
            vertical: false
          - type: tile
            entity: sensor.mhrv_exhaust_temperature
            name: Exhaust
            icon: mdi:home-export-outline
            grid_options:
              columns: 4
              min_columns: 4
          - type: tile
            entity: sensor.mhrv_extract_temperature
            name: Extract
            icon: mdi:export
            grid_options:
              columns: 4
              min_columns: 4
          - type: tile
            entity: sensor.mhrv_recovery
            name: Recovery
            grid_options:
              columns: 4
              min_columns: 4
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.mhrv_filter_state
            state_not: '0'
        card:
          type: tile
          entity: script.mhrv_filter_timer_reset
          name: Filter Timer Expired
          icon: mdi:air-filter
          hide_state: true
          tap_action:
            action: none
          icon_tap_action:
            action: none
          features:
            - type: button
              action_name: Reset
          features_position: inline
      - type: tile
        entity: sensor.mhrv_auto_bypass_current_state
        name: Bypass
        features_position: inline
        features:
          - type: custom:service-call
            entries:
              - type: dropdown
                entity_id: input_select.mhrv_auto_bypass_control
                value_attribute: state
                options:
                  - option: 'Off'
                    label: 'Off'
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target:
                        entity_id: input_select.mhrv_auto_bypass_control
                      data:
                        option: 'Off'
                  - option: 'On'
                    label: 'On'
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target:
                        entity_id: input_select.mhrv_auto_bypass_control
                      data:
                        option: 'On'
                  - option: Auto
                    label: Auto
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target:
                        entity_id: input_select.mhrv_auto_bypass_control
                      data:
                        option: Auto
        grid_options:
          columns: 6
          rows: auto
      - type: history-graph
        grid_options:
          columns: full
          rows: 4
        entities:
          - entity: sensor.mhrv_intake_temperature
            name: Intake
            color: red
          - entity: sensor.mhrv_supply_temperature
            name: Supply
            color: green
          - entity: sensor.mhrv_extract_temperature
            name: Extract
            color: blue
          - entity: sensor.mhrv_exhaust_temperature
            name: Exhaust
            color: orange
        hours_to_show: 24
        expand_legend: true
        min_y_axis: 10
        max_y_axis: 30
        fit_y_data: true
    column_span: 1
  - type: grid
    cards:
      - type: tile
        entity: fan.mhrv_fan_control
        name: Fan Speed
        icon: mdi:fan
        state_content: percentage
        features_position: bottom
        features:
          - type: fan-speed
          - type: fan-preset-modes
            style: icons
            preset_modes:
              - low
              - medium
              - high
        grid_options:
          columns: 12
          rows: auto
      - type: tile
        entity: sensor.mhrv_supply_fan_speed
        name: Supply Fan
        icon: mdi:fan
        grid_options:
          columns: 6
          rows: auto
      - type: tile
        entity: sensor.mhrv_extract_fan_speed
        name: Extract Fan
        icon: mdi:fan
        grid_options:
          columns: 6
          rows: auto
      - type: history-graph
        grid_options:
          columns: full
          rows: 4
        entities:
          - entity: sensor.mhrv_supply_fan_speed
            name: Supply
          - entity: sensor.mhrv_extract_fan_speed
            name: Extract
        hours_to_show: 1
        min_y_axis: 0
        max_y_axis: 3000
        fit_y_data: true
  - type: grid
    cards:
      - type: custom:apexcharts-card
        graph_span: 24h
        section_mode: true
        series:
          - entity: sensor.airgradient_bedroom_carbon_dioxide
            name: CO₂
            type: line
            stroke_width: 2
            color: var(--color-1)
            show:
              in_header: raw
              name_in_header: false
        apex_config:
          yaxis:
            - title:
                text: ppm
              min: 0
              max: 1200
          legend:
            show: false
          grid:
            padding:
              top: -30
        grid_options:
          rows: 3
          columns: full
        header:
          show: true
          title: CO₂ — Last 24 Hours
          show_states: true
        card_mod:
          style: |
            #header {
              display: flex !important;
              align-items: flex-start !important;
              justify-content: space-between !important;
            }

            #header__title {
              flex: 1 1 auto !important;
              padding-bottom: 0 !important;
            }

            #header__states {
              flex: 0 0 auto !important;
              flex-flow: row nowrap !important;
              margin: 0 !important;
            }

            #header__states > * {
              margin: 0 !important;
            }

            #states__state {
              flex: none !important;
              text
      - type: statistics-graph
        title: CO₂ — Last 7 Days
        entities:
          - sensor.airgradient_bedroom_carbon_dioxide
        days_to_show: 7
        period: hour
        stat_types:
          - mean
          - min
          - max
        chart_type: line
        min_y_axis: 0
        hide_legend: true
        grid_options:
          rows: 3
          columns: full
  - type: grid
    cards:
      - type: custom:apexcharts-card
        graph_span: 24h
        section_mode: true
        series:
          - entity: sensor.mhrv_humidity
            name: Humidity
            type: line
            stroke_width: 2
            color: var(--color-1)
            show:
              in_header: raw
              name_in_header: false
        apex_config:
          yaxis:
            min: 0
            max: 100
          legend:
            show: false
          grid:
            padding:
              top: -30
        grid_options:
          rows: 3
          columns: full
        header:
          show: true
          title: Humidity — Last 24 Hours
          show_states: true
        card_mod:
          style: |
            #header {
              display: flex !important;
              align-items: flex-start !important;
              justify-content: space-between !important;
            }

            #header__title {
              flex: 1 1 auto !important;
              padding-bottom: 0 !important;
            }

            #header__states {
              flex: 0 0 auto !important;
              flex-flow: row nowrap !important;
              margin: 0 !important;
            }

            #header__states > * {
              margin: 0 !important;
            }

            #states__state {
              flex: none !important;
              text
      - type: statistics-graph
        title: Humidity — Last 7 Days
        entities:
          - sensor.mhrv_humidity
        days_to_show: 7
        period: hour
        stat_types:
          - mean
          - min
          - max
        chart_type: line
        min_y_axis: 0
        max_y_axis: 100
        hide_legend: true
        grid_options:
          rows: 3
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: System Status
        icon: mdi:information-outline
      - type: tile
        entity: sensor.mhrv_alarm_code
        name: Alarm Code
        icon: mdi:alert-circle-outline
        grid_options:
          columns: 6
          rows: auto
      - type: tile
        entity: sensor.mhrv_manual_fan_percentage
        name: Manual Fan
        icon: mdi:fan-speed-3
        features:
          - type: bar-gauge
            min: 0
            max: 100
        grid_options:
          columns: 6
          rows: auto
