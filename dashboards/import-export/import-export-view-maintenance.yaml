title: Maintenance
path: maintenance
icon: mdi:database-cog-outline
type: sections
theme: standard-dashboard
max_columns: 3

sections:
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Rebuild Entity History
        icon: mdi:database-cog-outline
        grid_options:
          columns: full

      - type: vertical-stack
        grid_options:
          columns: 9
        cards:
          - type: entities
            entities:
              - entity: input_text.import_export_filter
                name: Entity Filter

              - entity: select.import_export_entity
                name: Entity

          - type: conditional
            conditions:
              - condition: state
                entity: script.rebuild_selected_entity
                state: "off"
            card:
              type: shortcut
              label: Rebuild
              icon: mdi:database-sync
              tap_action:
                action: perform-action
                perform_action: script.rebuild_selected_entity

          - type: conditional
            conditions:
              - condition: state
                entity: script.rebuild_selected_entity
                state: "on"
            card:
              type: shortcut
              label: Rebuilding...
              description: Operation in progress
              icon: mdi:progress-clock
              color: disabled
              tap_action:
                action: none
