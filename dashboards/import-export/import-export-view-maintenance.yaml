title: Maintenance
path: maintenance
icon: mdi:database-cog-outline
type: sections
theme: standard-dashboard
max_columns: 3

sections:
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Recalculate Entity History
        icon: mdi:database-cog-outline
        grid_options:
          columns: full

      - type: vertical-stack
        grid_options:
          columns: 9
        cards:
          - type: entities
            entities:
              - entity: input_text.import_export_filter
                name: Entity Filter

              - entity: select.import_export_entity
                name: Entity

          - type: vertical-stack
            cards:
              - type: shortcut
                label: Recalculate Statistics
                icon: mdi:calculator-variant
                tap_action:
                  action: perform-action
                  perform_action: script.recalculate_selected_entity_statistics

              - type: shortcut
                label: Reintegrate
                icon: mdi:chart-bell-curve-cumulative
                tap_action:
                  action: perform-action
                  perform_action: script.reintegrate_selected_entity
