#
# Decluttering template "energy_usage_graph_date_range"
#
# Usage:
#
#  - type: custom:decluttering-card
#    template: energy_usage_graph_date_range
#    grid_options:
#      columns: full
#      rows: 1
#    variables:
#      - date_start: input_datetime.energy_chart_range_start
#      - date_end: input_datetime.energy_chart_range_end
#      - solar: sensor.solar_energy_total_victron
#      - grid_import: sensor.grid_energy_import
#      - grid_export: sensor.grid_energy_export
#      - battery_charged: sensor.battery_energy_charged
#      - battery_discharged: sensor.battery_energy_discharged
#      - battery_percent: sensor.victron_gx_dc_battery_charge
#

card:
  type: custom:apexcharts-card

  experimental:                       # We are using direct apex chart configuration
    disable_config_validation: true   # that is not part of the standard configuration

  update_interval: 5min               # Prevent frequent automatic refresh

  apex_config:
    # ------------------------------------------------------------
    # General chart, axis and grid configuration
    # ------------------------------------------------------------
    chart:
      height: 300px
      events:
        # Grid tweaks - have grid lines for the 1st of each month
        # and every 5th day after / before
        mounted: |
          EVAL:function(chartContext, config) {
            const labels = config.globals.labels || [];
            if (!labels.length) return;

            const last = labels[labels.length - 1];
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(last);
            if (!match) return;

            const endYear = Number(match[1]);
            const endMonth = Number(match[2]);

            const showDate = value => {
              const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
              if (!m) return false;

              const year = Number(m[1]);
              const month = Number(m[2]);
              const day = Number(m[3]);

              /* In the final month, anchor to 1, 5, 10, 15, ... */
              if (year === endYear && month === endMonth) {
                return day === 1 || day % 5 === 0;
              }

              /* Before the final month, count backwards in 5-day steps
              ** from the first day of the following month. */
              const date = new Date(year, month - 1, day);
              const nextMonth = new Date(year, month, 1);
              const daysToNextMonth = Math.round((nextMonth - date) / 86400000);
              return daysToNextMonth > 0 && daysToNextMonth % 5 === 0;
            };

            const lines = chartContext.el.querySelectorAll('.apexcharts-gridlines-vertical line');
            lines.forEach((line, index) => {
              line.style.display = showDate(labels[index]) ? 'block' : 'none';
            });
          }
        updated: |
          EVAL:function(chartContext, config) {
            const labels = config.globals.labels || [];
            if (!labels.length) return;

            const last = labels[labels.length - 1];
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(last);
            if (!match) return;

            const endYear = Number(match[1]);
            const endMonth = Number(match[2]);

            const showDate = value => {
              const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
              if (!m) return false;

              const year = Number(m[1]);
              const month = Number(m[2]);
              const day = Number(m[3]);

              if (year === endYear && month === endMonth) {
                return day === 1 || day % 5 === 0;
              }

              const date = new Date(year, month - 1, day);
              const nextMonth = new Date(year, month, 1);
              const daysToNextMonth = Math.round((nextMonth - date) / 86400000);
              return daysToNextMonth > 0 && daysToNextMonth % 5 === 0;
            };

            const lines = chartContext.el.querySelectorAll('.apexcharts-gridlines-vertical line');
            lines.forEach((line, index) => {
              line.style.display = showDate(labels[index]) ? 'block' : 'none';
            });
          }

    yaxis:
    - seriesName:
      - Solar used
      - Battery used
      - Import
      - Battery charged
      - Export
      title:
        text: kWh
      labels:
        formatter: |
          EVAL:function(value) {
            return Number(value).toFixed(1);
          }
    - seriesName:
      - Battery
      - Battery min
      - Battery max
      opposite: true
      min: 0
      max: 100
      tickAmount: 5
      labels:
        formatter: |
          EVAL:function(value) {
            return Number(value).toFixed(0) + "%";
          }

    xaxis:
      type: category
      tickPlacement: between
      labels:
        rotate: 0
        hideOverlappingLabels: false
        formatter: |
          EVAL:function(value, timestamp, opts) {
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
            if (!match) return value;

            const year = Number(match[1]);
            const month = Number(match[2]);
            const day = Number(match[3]);

            const labels = opts?.w?.globals?.labels || [];
            const last = labels[labels.length - 1];
            const endMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(last || '');
            if (!endMatch) return '';

            const endYear = Number(endMatch[1]);
            const endMonth = Number(endMatch[2]);
            let show = false;

            /* In the final month, anchor to 1, 5, 10, 15, ... */
            if (year === endYear && month === endMonth) {
              show = day === 1 || day % 5 === 0;
            } else {
              /* Before the final month, count backwards in 5-day steps
              ** from the first day of the following month. */
              const date = new Date(year, month - 1, day);
              const nextMonth = new Date(year, month, 1);
              const daysToNextMonth = Math.round((nextMonth - date) / 86400000);
              show = daysToNextMonth > 0 && daysToNextMonth % 5 === 0;
            }

            if (!show) return '';

            return new Date(year, month - 1, day).toLocaleDateString(undefined, {
              day: 'numeric',
              month: 'short'
            });
          }

    grid:
      strokeDashArray: 0      # Solid grid lines
      xaxis:
        lines:
          show: true

    plotOptions:
      bar:
        columnWidth: 80%
        borderRadius: 2
        borderRadiusApplication: end

    legend:
      show: true
      clusterGroupedSeries: false

    stroke:
      show: true
      width: 1
      dashArray: 0

    # ------------------------------------------------------------
    # Custom tooltip, with the series in the order they appear
    # in the chart top-to-bottom, and with vertically aligned
    # values
    # ------------------------------------------------------------
    tooltip:
      enabled: true
      shared: false
      intersect: true
      followCursor: true
      custom: |
        EVAL:function({ series, seriesIndex, dataPointIndex, w }) {
          const rawLabel = w.globals.labels[dataPointIndex];
          let label = rawLabel;

          if (/^\d{4}-\d{2}-\d{2}$/.test(rawLabel)) {
            const [year, month, day] = rawLabel.split('-').map(Number);
            label = new Date(year, month - 1, day).toLocaleDateString(undefined, {
              weekday: 'short',
              day: 'numeric',
              month: 'short',
              year: 'numeric'
            });
          }

          const order = [2, 1, 0, 3, 4];

          let html =
            '<div style="padding:6px 8px;">' +
            '<div style="font-weight:600; margin-bottom:4px;">' +
            label +
            '</div>' +
            '<table style="border-collapse:collapse;">';

          order.forEach(i => {
            const value = series[i][dataPointIndex];

            if (value == null) return;

            html +=
              '<tr>' +
              '<td style="padding:1px 10px 1px 0;">' +
              '<span style="display:inline-block;width:8px;height:8px;' +
              'border-radius:50%;margin-right:6px;background:' +
              w.globals.colors[i] +
              ';"></span>' +
              w.globals.seriesNames[i] +
              '</td>' +
              '<td style="padding:1px 0;text-align:right;font-weight:600;">' +
              Math.abs(value).toFixed(2) +
              ' kWh</td>' +
              '</tr>';
          });

          const batteryIndex = w.globals.seriesNames.indexOf('Battery');

          if (batteryIndex >= 0) {
            const range = w.config.series[batteryIndex].data[dataPointIndex]?.y;

            if (Array.isArray(range) && range.length === 2) {
              html +=
                '<tr>' +
                '<td style="padding:1px 10px 1px 0;">' +
                '<span style="display:inline-block;width:8px;height:8px;' +
                'border-radius:50%;margin-right:6px;background:' +
                w.globals.colors[batteryIndex] +
                ';"></span>' +
                'Battery' +
                '</td>' +
                '<td style="padding:1px 0;text-align:right;font-weight:600;">' +
                (Number(range[0]).toFixed(0) != Number(range[1]).toFixed(0) ?  Number(range[0]).toFixed(0) + '-' : '') +
                Number(range[1]).toFixed(0) +
                '%</td>' +
                '</tr>';
            }
          }

          return html + '</table></div>';
        }

  card_mod:
    style: |
      /* ------------------------------------------------------------
      ** Vertical grid lines are selected by the ApexCharts mounted/
      ** updated handlers above so they follow the same calendar-date
      ** pattern as the x-axis labels. Hide all until that handler runs.
      ** -----------------------------------------------------------*/
      .apexcharts-gridlines-vertical line {
        display: none;
      }

      /* ------------------------------------------------------------
      ** Hide empty legend entries because apexchart still generates
      ** the containing divs (which take up space even if they are empty)
      ** -----------------------------------------------------------*/
      .apexcharts-legend-series:has(.apexcharts-legend-text:empty) {
        display: none !important;
      }

      /* ------------------------------------------------------------
      ** Right-align labels on the second/right-hand Y axis
      ** -----------------------------------------------------------*/
      .apexcharts-yaxis[rel="1"] text {
        text-anchor: end !important;
        transform: translateX(2em);
      }

      /* ------------------------------------------------------------
      ** Make legend markers match the series
      ** Make legend a two-row grid layout and reduce bottom margin
      ** -----------------------------------------------------------*/
      .apexcharts-legend-marker path {
        fill-opacity: 0.5 !important;
        stroke-opacity: 1.0 !important;
      }

      .apexcharts-legend {
        display: grid !important;
        grid-template-columns: repeat(3, max-content); /* Forces exactly 3 items per row */
        justify-content: center;
        column-gap: 1em;
        row-gap: 0.25em;
      }

      .apexcharts-legend-series {
        margin: 0 !important;
      }

      #graph {
        min-height: 0 !important;
        margin-bottom: 5px;
      }

      /* ------------------------------------------------------------
      ** format for the Battery area - click through, no lines
      ** -----------------------------------------------------------*/
      .apexcharts-series .apexcharts-rangeArea {
        stroke-width: 0px !important;
      }
      .apexcharts-series[seriesName="Battery"] {
        pointer-events: none !important;
      }

  # ------------------------------------------------------------
  # Stacked column chart configuration
  # ------------------------------------------------------------
  stacked: true
  all_series_config:
    type: column
    unit: kWh
    float_precision: 2
    opacity: 0.5
    show:
      in_legend: false
      legend_value: false

    # Shared data generator for all series EXCEPT solar which has its own
    data_generator: |

      /* Get the selected inclusive date range from the input_datetime helpers */
      const selectedStart = hass.states['[[date_start]]']?.state?.slice(0, 10);
      const selectedEnd = hass.states['[[date_end]]']?.state?.slice(0, 10);
      const validDate = /^\d{4}-\d{2}-\d{2}$/;

      if (!selectedStart || !selectedEnd ||
          !validDate.test(selectedStart) || !validDate.test(selectedEnd)) {
        return [];
      }

      /* Build local midnight boundaries; recorder end_time is exclusive */
      const [startYear, startMonth, startDay] = selectedStart.split('-').map(Number);
      const [endYear, endMonth, endDay] = selectedEnd.split('-').map(Number);
      const periodStart = new Date(startYear, startMonth - 1, startDay);
      const selectedPeriodEnd = new Date(endYear, endMonth - 1, endDay);

      if (selectedPeriodEnd < periodStart) {
        return [];
      }

      const periodEnd = new Date(endYear, endMonth - 1, endDay + 1);

      /* Build one category for every selected calendar day */
      const dateKey = date =>
        `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

      const days = [];
      for (
        let date = new Date(periodStart);
        date <= selectedPeriodEnd;
        date = new Date(date.getFullYear(), date.getMonth(), date.getDate() + 1)
      ) {
        days.push(new Date(date));
      }

      /* Get daily statistics for the entity of the series */
      const id = entity.entity_id;
      const stats = await hass.callWS({
        type: 'recorder/statistics_during_period',
        start_time: periodStart.toISOString(),
        end_time: periodEnd.toISOString(),
        statistic_ids: [id],
        period: 'day',
        types: ['change']
      });

      /* Map them to {date, value} tuples */
      const values = new Map(
        (stats[id] || []).map(x => [
          dateKey(new Date(x.start)),
          x.change
        ])
      );

      /* Adjustment factor for "negative" columns */
      const factor =
        id === '[[battery_charged]]' || id === '[[grid_export]]' ? -1 : 1;

      /* Return one value for every selected calendar day */
      /* no value or zero are represented as null */
      return days.map(date => {
        const key = dateKey(date);
        const value = values.get(key);
        return {
          x: key,
          y: value == null || value === 0 ? null : value * factor
        };
      });


  series:

    # ------------------------------------------------------------
    # SOLAR USED
    #
    # Calculated as (total) solar - grid_export - battery_charged 
    # ------------------------------------------------------------
    - entity: '[[solar]]'
      name: Solar used
      stack_group: energy
      color: var(--energy-solar-color)

      data_generator: |
        /* Get the selected inclusive date range from the input_datetime helpers */
        const selectedStart = hass.states['[[date_start]]']?.state?.slice(0, 10);
        const selectedEnd = hass.states['[[date_end]]']?.state?.slice(0, 10);
        const validDate = /^\d{4}-\d{2}-\d{2}$/;

        if (!selectedStart || !selectedEnd ||
            !validDate.test(selectedStart) || !validDate.test(selectedEnd)) {
          return [];
        }

        /* Build local midnight boundaries; recorder end_time is exclusive */
        const [startYear, startMonth, startDay] = selectedStart.split('-').map(Number);
        const [endYear, endMonth, endDay] = selectedEnd.split('-').map(Number);
        const periodStart = new Date(startYear, startMonth - 1, startDay);
        const selectedPeriodEnd = new Date(endYear, endMonth - 1, endDay);

        if (selectedPeriodEnd < periodStart) {
          return [];
        }

        const periodEnd = new Date(endYear, endMonth - 1, endDay + 1);

        /* Build one category for every selected calendar day */
        const dateKey = date =>
          `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

        const days = [];
        for (
          let date = new Date(periodStart);
          date <= selectedPeriodEnd;
          date = new Date(date.getFullYear(), date.getMonth(), date.getDate() + 1)
        ) {
          days.push(new Date(date));
        }

        /* Get daily statistics for the entities required to calculate the series */
        const ids = [
          '[[solar]]',
          '[[grid_export]]',
          '[[battery_charged]]'
        ];

        const stats = await hass.callWS({
          type: 'recorder/statistics_during_period',
          start_time: periodStart.toISOString(),
          end_time: periodEnd.toISOString(),
          statistic_ids: ids,
          period: 'day',
          types: ['change']
        });

        /* Map them to {date, value} tuples */
        const toMap = (id) =>
          new Map(
            (stats[id] || []).map(x => [
              dateKey(new Date(x.start)),
              x.change
            ])
          );

        const solar = toMap('[[solar]]');
        const exported = toMap('[[grid_export]]');
        const charged = toMap('[[battery_charged]]');

        /* Return one value for every selected calendar day */
        /* no value or zero are represented as null */
        return days.map(date => {
          const key = dateKey(date);

          /* get the raw solar production */
          const produced = solar.get(key);
          if (produced == null) { return { x: key, y: null }; }

          /* deduct what was exported or put into the battery */
          const used = Math.max(
            0,
            produced
              - (exported.get(key) ?? 0)
              - (charged.get(key) ?? 0)
          );

          /* Return the tuple */
          return {
            x: key,
            y: used === 0 ? null : used
          };
        });

    # ------------------------------------------------------------
    # All other entities
    # ------------------------------------------------------------
    - entity: '[[battery_discharged]]'
      name: Battery used
      stack_group: energy
      color: var(--energy-battery-out-color)

    - entity: '[[grid_import]]'
      name: Import
      stack_group: energy
      color: var(--energy-grid-consumption-color)

    - entity: '[[battery_charged]]'
      name: Battery charged
      stack_group: energy
      color: var(--energy-battery-in-color)

    - entity: '[[grid_export]]'
      name: Export
      stack_group: energy
      color: var(--energy-grid-return-color)


    # ------------------------------------------------------------
    # Dummy series for display in legend
    # in the order we want them to appear
    # ------------------------------------------------------------
    - entity: '[[grid_import]]'
      name: Import
      stack_group: energy
      color: var(--energy-grid-consumption-color)
      show:
        in_legend: true
      data_generator: "const s = hass.states['[[date_start]]']?.state?.slice(0, 10); return s ? [{ x: s, y: null }] : [];"

    - entity: '[[battery_discharged]]'
      name: Battery used
      stack_group: energy
      color: var(--energy-battery-out-color)
      show:
        in_legend: true
      data_generator: "const s = hass.states['[[date_start]]']?.state?.slice(0, 10); return s ? [{ x: s, y: null }] : [];"

    - entity: '[[solar]]'
      name: Solar used
      stack_group: energy
      color: var(--energy-solar-color)
      show:
        in_legend: true
      data_generator: "const s = hass.states['[[date_start]]']?.state?.slice(0, 10); return s ? [{ x: s, y: null }] : [];"

    - entity: '[[battery_charged]]'
      name: Battery charged
      stack_group: energy
      color: var(--energy-battery-in-color)
      show:
        in_legend: true
      data_generator: "const s = hass.states['[[date_start]]']?.state?.slice(0, 10); return s ? [{ x: s, y: null }] : [];"

    - entity: '[[grid_export]]'
      name: Export
      stack_group: energy
      color: var(--energy-grid-return-color)
      show:
        in_legend: true
      data_generator: "const s = hass.states['[[date_start]]']?.state?.slice(0, 10); return s ? [{ x: s, y: null }] : [];"

    # ------------------------------------------------------------
    # Battery charge range
    #
    # "rangeArea" is not "officially" supported by the apexchart-card
    # hence the disable_config_validation: true at the top
    # ------------------------------------------------------------
    - entity: '[[battery_percent]]'
      name: Battery
      type: rangeArea
      unit: '%'
      opacity: 0.15
      stroke_width: 2
      curve: smooth
      extend_to: false
      show:
        in_legend: true
        legend_value: false
      color: black
      data_generator: |
        const selectedStart = hass.states['[[date_start]]']?.state?.slice(0, 10);
        const selectedEnd = hass.states['[[date_end]]']?.state?.slice(0, 10);
        if (!selectedStart || !selectedEnd) return [];
        const [sy, sm, sd] = selectedStart.split('-').map(Number);
        const [ey, em, ed] = selectedEnd.split('-').map(Number);
        const periodStart = new Date(sy, sm - 1, sd);
        const selectedPeriodEnd = new Date(ey, em - 1, ed);
        if (selectedPeriodEnd < periodStart) return [];
        const periodEnd = new Date(ey, em - 1, ed + 1);
        const dateKey = date =>
          `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        const days = [];
        for (
          let date = new Date(periodStart);
          date <= selectedPeriodEnd;
          date = new Date(date.getFullYear(), date.getMonth(), date.getDate() + 1)
        ) {
          days.push(new Date(date));
        }
        const id = entity.entity_id;
        const stats = await hass.callWS({
          type: 'recorder/statistics_during_period',
          start_time: periodStart.toISOString(),
          end_time: periodEnd.toISOString(),
          statistic_ids: [id],
          period: 'day',
          types: ['min', 'max']
        });
        const values = new Map(
          (stats[id] || []).map(x => [
            dateKey(new Date(x.start)),
            x.min == null || x.max == null ? null : [x.min, x.max]
          ])
        );
        return days.map(date => {
          const key = dateKey(date);
          return {
            x: key,
            y: values.get(key) ?? null
          };
        });

