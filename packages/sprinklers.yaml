utility_meter:
  garden_sprinklers_front_lawn_station_water_daily:
    name: "Garden Sprinklers Front Lawn Station Water Daily"
    unique_id: garden_sprinklers_front_lawn_station_water_daily
    source: sensor.garden_sprinklers_front_lawn_station_water_total
    cycle: daily
    periodically_resetting: false

