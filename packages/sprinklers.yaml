# Station specific water sensors/meters
#
# Stations: 
# - garden_sprinklers_front_lawn_station
# - garden_sprinklers_lawn_left_1_station
# - garden_sprinklers_lawn_left_2_station
# - garden_sprinklers_lawn_mid_station
# - garden_sprinklers_lawn_right_station
# - garden_sprinklers_trees_station
# - garden_sprinklers_veggies_station
#
# The OpenSprinkler integration only has a single flow meter covering all stations.
# Since only one station can run at a time, we can use the flow meter to measure
# the water usage for each station.
#
# For each of the above stations, the below creates 
#    - a flow rate sensor (..._flow_rate)
#    - a water total sensor (..._water_total), and
#    - a daily utility meter (..._water_daily).
#

template:
  - sensor:
      # Front Lawn
      - name: "Garden Sprinklers Front Lawn Station Flow Rate"
        unique_id: garden_sprinklers_front_lawn_station_flow_rate
        device_class: volume_flow_rate
        state_class: measurement
        unit_of_measurement: "L/min"
        availability: >
          {{
            states('binary_sensor.garden_sprinklers_front_lawn_station_running')
              in ['on', 'off']
            and (
              is_state(
                'binary_sensor.garden_sprinklers_front_lawn_station_running',
                'off'
              )
              or is_number(states('sensor.garden_sprinklers_flow_rate'))
            )
          }}
        state: >
          {% if is_state(
            'binary_sensor.garden_sprinklers_front_lawn_station_running',
            'on'
          ) %}
            {{ states('sensor.garden_sprinklers_flow_rate') | float }}
          {% else %}
            0
          {% endif %}

      # Lawn Left 1
      - name: "Garden Sprinklers Lawn Left 1 Station Flow Rate"
        unique_id: garden_sprinklers_lawn_left_1_station_flow_rate
        device_class: volume_flow_rate
        state_class: measurement
        unit_of_measurement: "L/min"
        availability: >
          {{
            states('binary_sensor.garden_sprinklers_lawn_left_1_station_running')
              in ['on', 'off']
            and (
              is_state(
                'binary_sensor.garden_sprinklers_lawn_left_1_station_running',
                'off'
              )
              or is_number(states('sensor.garden_sprinklers_flow_rate'))
            )
          }}
        state: >
          {% if is_state(
            'binary_sensor.garden_sprinklers_lawn_left_1_station_running',
            'on'
          ) %}
            {{ states('sensor.garden_sprinklers_flow_rate') | float }}
          {% else %}
            0
          {% endif %}

      # Lawn Left 2
      - name: "Garden Sprinklers Lawn Left 2 Station Flow Rate"
        unique_id: garden_sprinklers_lawn_left_2_station_flow_rate
        device_class: volume_flow_rate
        state_class: measurement
        unit_of_measurement: "L/min"
        availability: >
          {{
            states('binary_sensor.garden_sprinklers_lawn_left_2_station_running')
              in ['on', 'off']
            and (
              is_state(
                'binary_sensor.garden_sprinklers_lawn_left_2_station_running',
                'off'
              )
              or is_number(states('sensor.garden_sprinklers_flow_rate'))
            )
          }}
        state: >
          {% if is_state(
            'binary_sensor.garden_sprinklers_lawn_left_2_station_running',
            'on'
          ) %}
            {{ states('sensor.garden_sprinklers_flow_rate') | float }}
          {% else %}
            0
          {% endif %}

      # Lawn Mid
      - name: "Garden Sprinklers Lawn Mid Station Flow Rate"
        unique_id: garden_sprinklers_lawn_mid_station_flow_rate
        device_class: volume_flow_rate
        state_class: measurement
        unit_of_measurement: "L/min"
        availability: >
          {{
            states('binary_sensor.garden_sprinklers_lawn_mid_station_running')
              in ['on', 'off']
            and (
              is_state(
                'binary_sensor.garden_sprinklers_lawn_mid_station_running',
                'off'
              )
              or is_number(states('sensor.garden_sprinklers_flow_rate'))
            )
          }}
        state: >
          {% if is_state(
            'binary_sensor.garden_sprinklers_lawn_mid_station_running',
            'on'
          ) %}
            {{ states('sensor.garden_sprinklers_flow_rate') | float }}
          {% else %}
            0
          {% endif %}

      # Lawn Right
      - name: "Garden Sprinklers Lawn Right Station Flow Rate"
        unique_id: garden_sprinklers_lawn_right_station_flow_rate
        device_class: volume_flow_rate
        state_class: measurement
        unit_of_measurement: "L/min"
        availability: >
          {{
            states('binary_sensor.garden_sprinklers_lawn_right_station_running')
              in ['on', 'off']
            and (
              is_state(
                'binary_sensor.garden_sprinklers_lawn_right_station_running',
                'off'
              )
              or is_number(states('sensor.garden_sprinklers_flow_rate'))
            )
          }}
        state: >
          {% if is_state(
            'binary_sensor.garden_sprinklers_lawn_right_station_running',
            'on'
          ) %}
            {{ states('sensor.garden_sprinklers_flow_rate') | float }}
          {% else %}
            0
          {% endif %}

      # Trees
      - name: "Garden Sprinklers Trees Station Flow Rate"
        unique_id: garden_sprinklers_trees_station_flow_rate
        device_class: volume_flow_rate
        state_class: measurement
        unit_of_measurement: "L/min"
        availability: >
          {{
            states('binary_sensor.garden_sprinklers_trees_station_running')
              in ['on', 'off']
            and (
              is_state(
                'binary_sensor.garden_sprinklers_trees_station_running',
                'off'
              )
              or is_number(states('sensor.garden_sprinklers_flow_rate'))
            )
          }}
        state: >
          {% if is_state(
            'binary_sensor.garden_sprinklers_trees_station_running',
            'on'
          ) %}
            {{ states('sensor.garden_sprinklers_flow_rate') | float }}
          {% else %}
            0
          {% endif %}

      # Veggies
      - name: "Garden Sprinklers Veggies Station Flow Rate"
        unique_id: garden_sprinklers_veggies_station_flow_rate
        device_class: volume_flow_rate
        state_class: measurement
        unit_of_measurement: "L/min"
        availability: >
          {{
            states('binary_sensor.garden_sprinklers_veggies_station_running')
              in ['on', 'off']
            and (
              is_state(
                'binary_sensor.garden_sprinklers_veggies_station_running',
                'off'
              )
              or is_number(states('sensor.garden_sprinklers_flow_rate'))
            )
          }}
        state: >
          {% if is_state(
            'binary_sensor.garden_sprinklers_veggies_station_running',
            'on'
          ) %}
            {{ states('sensor.garden_sprinklers_flow_rate') | float(0) or 1 }}
          {% else %}
            0
          {% endif %}


# Consolidated lawn flow rate and water total sensors
      - name: "Garden Sprinklers All Lawns Flow Rate"
        unique_id: garden_sprinklers_all_lawns_flow_rate
        device_class: volume_flow_rate
        state_class: measurement
        unit_of_measurement: "L/min"
        availability: >
          {{
            is_number(states('sensor.garden_sprinklers_front_lawn_station_flow_rate'))
            or is_number(states('sensor.garden_sprinklers_lawn_left_1_station_flow_rate'))
            or is_number(states('sensor.garden_sprinklers_lawn_left_2_station_flow_rate'))
            or is_number(states('sensor.garden_sprinklers_lawn_mid_station_flow_rate'))
            or is_number(states('sensor.garden_sprinklers_lawn_right_station_flow_rate'))
          }}
        state: >
          {{
            states('sensor.garden_sprinklers_front_lawn_station_flow_rate')    | float(0)
            + states('sensor.garden_sprinklers_lawn_left_1_station_flow_rate') | float(0)
            + states('sensor.garden_sprinklers_lawn_left_2_station_flow_rate') | float(0)
            + states('sensor.garden_sprinklers_lawn_mid_station_flow_rate')    | float(0)
            + states('sensor.garden_sprinklers_lawn_right_station_flow_rate')  | float(0)
          }}

      - name: "Garden Sprinklers All Lawns Water Total"
        unique_id: garden_sprinklers_all_lawns_water_total
        device_class: water
        state_class: total
        unit_of_measurement: "L"
        availability: >
          {{
            is_number(states('sensor.garden_sprinklers_front_lawn_station_water_total'))
            or is_number(states('sensor.garden_sprinklers_lawn_left_1_station_water_total'))
            or is_number(states('sensor.garden_sprinklers_lawn_left_2_station_water_total'))
            or is_number(states('sensor.garden_sprinklers_lawn_mid_station_water_total'))
            or is_number(states('sensor.garden_sprinklers_lawn_right_station_water_total'))
          }}
        state: >
          {{
            states('sensor.garden_sprinklers_front_lawn_station_water_total')    | float(0)
            + states('sensor.garden_sprinklers_lawn_left_1_station_water_total') | float(0)
            + states('sensor.garden_sprinklers_lawn_left_2_station_water_total') | float(0)
            + states('sensor.garden_sprinklers_lawn_mid_station_water_total')    | float(0)
            + states('sensor.garden_sprinklers_lawn_right_station_water_total')  | float(0)
          }}

# Next run date and time for three programs - veggies, tries, dry lawns
      - name: "Garden Sprinklers: Trees Next Run"
        unique_id: garden_sprinklers_trees_next_run
        default_entity_id: sensor.garden_sprinklers_trees_next_run
        device_class: timestamp
        icon: mdi:calendar-clock
        state: >
          {% from 'opensprinkler-helpers.jinja' import next_program_run %}
          {% set get_next_run = next_program_run | as_function %}
          {% set result = get_next_run('garden_sprinklers_trees') %}
          {{ result.isoformat() if result is not none else none }}

      - name: "Garden Sprinklers: Veggies Next Run"
        unique_id: garden_sprinklers_veggies_next_run
        default_entity_id: sensor.garden_sprinklers_veggies_next_run
        device_class: timestamp
        icon: mdi:calendar-clock
        state: >
          {% from 'opensprinkler-helpers.jinja' import next_program_run %}
          {% set get_next_run = next_program_run | as_function %}
          {% set result = get_next_run('garden_sprinklers_veggies') %}
          {{ result.isoformat() if result is not none else none }}

      - name: "Garden Sprinklers: Lawns Next Run"
        unique_id: garden_sprinklers_lawns_next_run
        default_entity_id: sensor.garden_sprinklers_lawns_next_run
        device_class: timestamp
        icon: mdi:calendar-clock
        state: >
          {% from 'opensprinkler-helpers.jinja' import next_program_run %}
          {% set get_next_run = next_program_run | as_function %}
          {% set result = get_next_run('garden_sprinklers_lawns') %}
          {{ result.isoformat() if result is not none else none }}

  # Flag for each program if any of the stations for a programme were started by HASS,
  # useful to show status 'Pending' while opensprinkler starts them which takes a few
  # seconds
  - binary_sensor:
      - name: Garden Sprinklers Trees Pending
        unique_id: garden_sprinklers_trees_program_pending
        default_entity_id: binary_sensor.garden_sprinklers_trees_program_pending
        auto_off: 15
        state: >
          {% if trigger.id == 'requested' %}
            true
          {% elif trigger.id == 'status_changed' %}
            false
          {% else %}
            {{ this.state == 'on' }}
          {% endif %}

    triggers:
      # Start command issued -> pending ON immediately
      # (subject it coming from the expected entities, see condition below)
      - trigger: event
        event_type: call_service
        event_data:
          domain: opensprinkler
          service: run_station
        id: requested

      # Controller reports actual running -> pending OFF
      - trigger: state
        entity_id: binary_sensor.garden_sprinklers_trees_station_status
        from: "idle"
        id: status_changed

    conditions:
      - condition: template
        value_template: >
          {% if trigger.id == 'requested' %}
            {% set monitored = [
              'switch.garden_sprinklers_trees_station_enabled'
            ] %}
            {% set entity = trigger.event.data.service_data.entity_id | default([]) %}
            {% set requested = [entity] if entity is string else entity %}
            {{ requested | select('in', monitored) | list | count > 0 }}
          {% else %}
            true
          {% endif %}

  - binary_sensor:
      - name: Garden Sprinklers Veggies Pending
        unique_id: garden_sprinklers_veggies_program_pending
        default_entity_id: binary_sensor.garden_sprinklers_veggies_program_pending
        auto_off: 15
        state: >
          {% if trigger.id == 'requested' %}
            true
          {% elif trigger.id == 'status_changed' %}
            false
          {% else %}
            {{ this.state == 'on' }}
          {% endif %}

    triggers:
      # Start command issued -> pending ON immediately
      # (subject it coming from the expected entities, see condition below)
      - trigger: event
        event_type: call_service
        event_data:
          domain: opensprinkler
          service: run_station
        id: requested

      # Controller reports actual running -> pending OFF
      - trigger: state
        entity_id: binary_sensor.garden_sprinklers_veggies_station_status
        from: "idle"
        id: status_changed

    conditions:
      - condition: template
        value_template: >
          {% if trigger.id == 'requested' %}
            {% set monitored = [
              'switch.garden_sprinklers_veggies_station_enabled'
            ] %}
            {% set entity = trigger.event.data.service_data.entity_id | default([]) %}
            {% set requested = [entity] if entity is string else entity %}
            {{ requested | select('in', monitored) | list | count > 0 }}
          {% else %}
            true
          {% endif %}

  - binary_sensor:
      - name: Garden Sprinklers Lawns Pending
        unique_id: garden_sprinklers_lawns_program_pending
        default_entity_id: binary_sensor.garden_sprinklers_lawns_program_pending
        auto_off: 15

        state: >
          {% if trigger.id == 'requested' %}
            true
          {% elif trigger.id == 'status_changed' %}
            false
          {% else %}
            {{ this.state == 'on' }}
          {% endif %}

    triggers:
      # Start command issued -> pending ON immediately
      # (subject it coming from the expected entities, see condition below)
      - trigger: event
        event_type: call_service
        event_data:
          domain: opensprinkler
          service: run_station
        id: requested

      # Controller has acknowledged one of our stations -> pending OFF
      - trigger: state
        entity_id:
          - sensor.garden_sprinklers_front_lawn_station_status
          - sensor.garden_sprinklers_lawn_left_1_station_status
          - sensor.garden_sprinklers_lawn_left_2_station_status
          - sensor.garden_sprinklers_lawn_mid_station_status
          - sensor.garden_sprinklers_lawn_right_station_status
        from: "idle"
        id: status_changed

    conditions:
      - condition: template
        value_template: >
          {% if trigger.id == 'requested' %}
            {% set monitored = [
              'switch.garden_sprinklers_front_lawn_station_enabled',
              'switch.garden_sprinklers_lawn_left_1_station_enabled',
              'switch.garden_sprinklers_lawn_left_2_station_enabled',
              'switch.garden_sprinklers_lawn_mid_station_enabled',
              'switch.garden_sprinklers_lawn_right_station_enabled'
            ] %}
            {% set entity = trigger.event.data.service_data.entity_id | default([]) %}
            {% set requested = [entity] if entity is string else entity %}
            {{ requested | select('in', monitored) | list | count > 0 }}
          {% else %}
            true
          {% endif %}


  # Flag for each program if it is currently pending/runnong or inactive
  # uses the stations belogning to the programme instead of the programme itseld
  # because manually starting programmes would otherwise not be shown
  - binary_sensor:
      - name: "Garden Sprinklers: Trees Status"
        unique_id: garden_sprinklers_trees_program_status
        default_entity_id: binary_sensor.garden_sprinklers_trees_program_status
        device_class: running
        icon: mdi:sprinkler
        state: >
          {{
            is_state('binary_sensor.garden_sprinklers_trees_program_running', 'on')
            or is_state('binary_sensor.garden_sprinklers_trees_station_running', 'on')
          }}
        attributes:
          running_text: >
            {% from 'opensprinkler-helpers.jinja' import remaining_time_text %}
            {% 
              if is_state('binary_sensor.garden_sprinklers_trees_program_pending', 'on')
              or is_state('binary_sensor.garden_sprinklers_trees_program_running', 'on')
              or is_state('binary_sensor.garden_sprinklers_trees_station_running', 'on')
            %}
              {% 
                set text = remaining_time_text(
                  'binary_sensor.garden_sprinklers_trees_station_running'
                ) 
              %}
              {{ text if text | trim else 'Starting' }}
            {% endif %}
          next_run: >
            {% from 'opensprinkler-helpers.jinja' import next_run_text %}
            {% set value = states('sensor.garden_sprinklers_trees_next_run') %}
            {{ next_run_text(value) }}

    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.garden_sprinklers_veggies_program_running
          - binary_sensor.garden_sprinklers_veggies_station_running
      - trigger: time_pattern
        seconds: "*"

  - binary_sensor:
      - name: "Garden Sprinklers: Veggies Status"
        unique_id: garden_sprinklers_veggies_program_status
        default_entity_id: binary_sensor.garden_sprinklers_veggies_program_status
        device_class: running
        icon: mdi:sprinkler
        state: >
          {{
            is_state('binary_sensor.garden_sprinklers_veggies_program_running', 'on')
            or is_state('binary_sensor.garden_sprinklers_veggies_station_running', 'on')
          }}
        attributes:
          running_text: >
            {% from 'opensprinkler-helpers.jinja' import remaining_time_text %}
            {% 
              if is_state('binary_sensor.garden_sprinklers_veggies_program_pending', 'on')
              or is_state('binary_sensor.garden_sprinklers_veggies_program_running', 'on')
              or is_state('binary_sensor.garden_sprinklers_veggies_station_running', 'on')
            %}
              {% 
                set text = remaining_time_text(
                  'binary_sensor.garden_sprinklers_veggies_station_running'
                ) 
              %}
              {{ text if text | trim else 'Starting' }}
            {% endif %}
          next_run: >
            {% from 'opensprinkler-helpers.jinja' import next_run_text %}
            {% set value = states('sensor.garden_sprinklers_veggies_next_run') %}
            {{ next_run_text(value) }}

    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.garden_sprinklers_veggies_program_running
          - binary_sensor.garden_sprinklers_veggies_station_running
      - trigger: time_pattern
        seconds: "*"

  - binary_sensor:
      - name: "Garden Sprinklers: Lawns Status"
        unique_id: garden_sprinklers_lawns_program_status
        default_entity_id: binary_sensor.garden_sprinklers_lawns_program_status
        device_class: running
        icon: mdi:sprinkler
        state: >
          {{
            is_state('binary_sensor.garden_sprinklers_lawns_program_running', 'on')
            or is_state('binary_sensor.garden_sprinklers_front_lawn_station_running', 'on')
            or is_state('binary_sensor.garden_sprinklers_lawn_left_1_station_running', 'on')
            or is_state('binary_sensor.garden_sprinklers_lawn_left_2_station_running', 'on')
            or is_state('binary_sensor.garden_sprinklers_lawn_mid_station_running', 'on')
            or is_state('binary_sensor.garden_sprinklers_lawn_right_station_running', 'on')
          }}
        attributes:
          running_text: >
            {% from 'opensprinkler-helpers.jinja' import remaining_time_text %}
            {% 
              if is_state('binary_sensor.garden_sprinklers_lawns_program_pending', 'on')
              or is_state('binary_sensor.garden_sprinklers_lawns_program_running', 'on')
              or is_state('binary_sensor.garden_sprinklers_front_lawn_station_running', 'on')
              or is_state('binary_sensor.garden_sprinklers_lawn_left_1_station_running', 'on')
              or is_state('binary_sensor.garden_sprinklers_lawn_left_2_station_running', 'on')
              or is_state('binary_sensor.garden_sprinklers_lawn_mid_station_running', 'on')
              or is_state('binary_sensor.garden_sprinklers_lawn_right_station_running', 'on')
            %}
              {% 
                set text = remaining_time_text(
                  'binary_sensor.garden_sprinklers_front_lawn_station_running',
                  'binary_sensor.garden_sprinklers_lawn_left_1_station_running',
                  'binary_sensor.garden_sprinklers_lawn_left_2_station_running',
                  'binary_sensor.garden_sprinklers_lawn_mid_station_running',
                  'binary_sensor.garden_sprinklers_lawn_right_station_running'
                ) 
              %}
              {{ text if text | trim else 'Starting' }}
            {% endif %}
          next_run: >
            {% from 'opensprinkler-helpers.jinja' import next_run_text %}
            {% set value = states('sensor.garden_sprinklers_lawns_next_run') %}
            {{ next_run_text(value) }}

    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.garden_sprinklers_lawns_program_running
          - binary_sensor.garden_sprinklers_front_lawn_station_running
          - binary_sensor.garden_sprinklers_lawn_left_1_station_running
          - binary_sensor.garden_sprinklers_lawn_left_2_station_running
          - binary_sensor.garden_sprinklers_lawn_mid_station_running
          - binary_sensor.garden_sprinklers_lawn_right_station_running
      - trigger: time_pattern
        seconds: "*"



sensor:
  - platform: integration
    source: sensor.garden_sprinklers_front_lawn_station_flow_rate
    name: "Garden Sprinklers Front Lawn Station Water Total"
    unique_id: garden_sprinklers_front_lawn_station_water_total
    unit_time: min
    method: left
    round: 2
    max_sub_interval:
