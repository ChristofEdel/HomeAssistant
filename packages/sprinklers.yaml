sensor:
  - platform: integration
    source: sensor.garden_sprinklers_front_lawn_station_flow_rate
    name: "Garden Sprinklers Front Lawn Station Water Total"
    unique_id: garden_sprinklers_front_lawn_station_water_total
    unit_time: min
    method: left
    round: 2
    max_sub_interval:
      seconds: 10

  - platform: integration
    source: sensor.garden_sprinklers_lawn_left_1_station_flow_rate
    name: "Garden Sprinklers Lawn Left 1 Station Water Total"
    unique_id: garden_sprinklers_lawn_left_1_station_water_total
