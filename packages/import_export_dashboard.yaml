input_text:
  import_export_filter:
    name: Search

  import_export_file:
    name: File
    max: 255

input_select:
  import_export_import_mode:
    name: Existing States
    options:
      - append
      - overwrite
      - replace
    initial: append

  import_export_time_zone:
    name: Time Zone
    options:
      - UTC
      - local
    initial: UTC

script:
  get_entity_history:
    alias: Entity History
    fields:
      entity_id:
        name: Entity
        required: true
        selector:
          entity:
            domain: sensor
      history_type:
        name: History Type
        required: true
        selector:
          select:
            options:
              - recorder
              - short_term
              - long_term
    sequence:
      - variables:
          query: >-
            {% if history_type == 'short_term' %}
              SELECT
                statistics_short_term.start_ts,
                statistics_short_term.mean,
                statistics_short_term.min,
                statistics_short_term.max,
                statistics_short_term.state,
                statistics_short_term.sum,
                statistics_short_term.last_reset_ts,
                statistics_meta.unit_of_measurement
              FROM statistics_short_term
              INNER JOIN statistics_meta
                ON statistics_short_term.metadata_id = statistics_meta.id
              WHERE statistics_meta.statistic_id = '{{ entity_id }}'
              ORDER BY statistics_short_term.start_ts DESC
              LIMIT 10000
            {% elif history_type == 'long_term' %}
              SELECT
                statistics.start_ts,
                statistics.mean,
                statistics.min,
                statistics.max,
                statistics.state,
                statistics.sum,
                statistics.last_reset_ts,
                statistics_meta.unit_of_measurement
              FROM statistics
              INNER JOIN statistics_meta
                ON statistics.metadata_id = statistics_meta.id
              WHERE statistics_meta.statistic_id = '{{ entity_id }}'
              ORDER BY statistics.start_ts DESC
            {% else %}
              SELECT
                states.state,
                states.last_updated_ts
              FROM states
              INNER JOIN states_meta
                ON states.metadata_id = states_meta.metadata_id
              WHERE states_meta.entity_id = '{{ entity_id }}'
              ORDER BY states.last_updated_ts DESC
            {% endif %}

      - action: sql.query
        data:
          query: "{{ query }}"
        response_variable: result

      - stop: ""
        response_variable: result

  get_entity_recorder_history:
    alias: Entity History - Recorder
    fields:
      entity_id:
        name: Entity
        required: true
        selector:
          entity:
            domain: sensor
    sequence:
      - action: script.get_entity_history
        data:
          entity_id: "{{ entity_id }}"
          history_type: recorder
        response_variable: result

      - stop: ""
        response_variable: result

  get_entity_short_term_statistics:
    alias: Entity History - Short-Term Statistics
    fields:
      entity_id:
        name: Entity
        required: true
        selector:
          entity:
            domain: sensor
    sequence:
      - action: script.get_entity_history
        data:
          entity_id: "{{ entity_id }}"
          history_type: short_term
        response_variable: result

      - stop: ""
        response_variable: result

  get_entity_long_term_statistics:
    alias: Entity History - Long-Term Statistics
    fields:
      entity_id:
        name: Entity
        required: true
        selector:
          entity:
            domain: sensor
    sequence:
      - action: script.get_entity_history
        data:
          entity_id: "{{ entity_id }}"
          history_type: long_term
        response_variable: result

      - stop: ""
        response_variable: result

  import_selected_entity_history:
    alias: Import Selected Entity History
    sequence:
      - action: history_import.import
        data:
          entity: "{{ states('select.import_export_entity') }}"
          file: "{{ states('input_text.import_export_file') }}"
          import_mode: "{{ states('input_select.import_export_import_mode') }}"
          time_zone: "{{ states('input_select.import_export_time_zone') }}"

  recalculate_selected_entity_statistics:
    alias: Recalculate Selected Entity Statistics
    sequence:
      - action: history_import.recalculate
        data:
          entity: "{{ states('select.import_export_entity') }}"

  reintegrate_selected_entity:
    alias: Reintegrate Selected Entity
    sequence:
      - action: history_import.reintegrate
        data:
          entity: "{{ states('select.import_export_entity') }}"

template:
  # Build the list from Recorder states and statistics metadata.
  - sensor:
      - name: Import Export Entity List
        default_entity_id: sensor.import_export_entity_list
        unique_id: import_export_entity_list
        state: "{{ recorder_entities.result | count }}"
        attributes:
          entities: >-
            {{ recorder_entities.result
               | map(attribute='entity_id')
               | list }}

    triggers:
      - trigger: homeassistant
        event: start

      - trigger: event
        event_type: event_template_reloaded

    actions:
      - action: sql.query
        data:
          query: >-
            SELECT entity_id
            FROM (
              SELECT entity_id
              FROM states_meta
              WHERE entity_id LIKE 'sensor.%'
              UNION
              SELECT statistic_id AS entity_id
              FROM statistics_meta
              WHERE statistic_id LIKE 'sensor.%'
            ) AS sensor_entities
            ORDER BY entity_id
        response_variable: recorder_entities

  # Dashboard selector, filtered by the search helper.
  - select:
      - name: Import Export Entity
        default_entity_id: select.import_export_entity
        unique_id: import_export_entity
        optimistic: true
        options: >-
          {% set entities =
            state_attr('sensor.import_export_entity_list', 'entities') or []
          %}
          {% set filter = states('input_text.import_export_filter') | lower %}
          {{ entities
            | select('search', filter, ignorecase=true)
            | list
          }}

recorder:
  exclude:
    entities:
      - sensor.import_export_entity_list
      - select.import_export_entity
      - input_text.import_export_filter
      - input_text.import_export_file
      - input_select.import_export_import_mode
      - input_select.import_export_time_zone
      - input_button.history_dashboard_get_recorder_history
      - input_button.history_dashboard_get_short_term_statistics
      - input_button.history_dashboard_get_long_term_statistics
