# Home assistant package: Controller for battery charge / discharge control.
#
# Normally, the Inverter is set to charge and discharge the battery so there is zero import or export
# of power from the grid.
#
# This package allows the user to set 
#   - a minimum battery charge level, below which the inverter will be forced to charge the battery 
#     at maximum rate (from all sources including the grid)
#     This can be used to charge the battery during cheaper tariff periods
#
#   - a maximum battery charge level, above which charging will be disabled 
#     This can be used to keep the battery below 100% to preserve battery life or to preserve
#     charging headroom to absorb a spike when the grid fails
#
#   - a "do not discharge" flag that, if set, will prevent the inverter from discharging the battery at all, 
#     even if the battery is above the minimum charge level. This can be used to prevent excessive battery 
#     use by high-power consumers such as an EV charger

# packages/battery_control.yaml

input_number:
  battery_control_charge_limit_manual:
    name: "Battery Control: Manual charge limit"
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:battery-lock

  battery_control_charge_target_manual:
    name: "Battery Control: Manual charge target"
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:battery-charging

  battery_control_charge_target_off_peak:
    name: "Battery Control Config: Off-peak charge target"
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:battery-charging-10

  battery_control_charge_limit_hysteresis:
    name: "Battery Control Config: Charge limit hysteresis"
    min: 0
    max: 20
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:swap-vertical

  battery_control_charge_limit_top_up:
    name: "Battery Control Config: Top-up added after reaching charge limit"
    min: 0
    max: 1.0
    step: 0.1
    mode: slider
    unit_of_measurement: "kWh"
    icon: mdi:swap-vertical

  battery_control_charge_target_top_up:
    name: "Battery Control Config: Top-up added after reaching charge target"
    min: 0
    max: 1.0
    step: 0.1
    mode: slider
    unit_of_measurement: "kWh"
    icon: mdi:swap-vertical

input_boolean:
  battery_control_prevent_discharging_manual:
    name: "Battery Control: Manual \"prevent discharging\""
    icon: mdi:battery-lock-outline

  # Internal: ensures defaults are only applied once.
  battery_control_initialised:
    name: "Battery Control: Settings Initialised"
    icon: mdi:cog-check

sensor:
  # Signed battery energy flow: + for energy charged, - for energy discharging
  # 10 second integration interval is fast enough because the control variable
  # (battery charge) changes in minutes (order of magnitude)
  - platform: integration
    source: sensor.victron_real_time_battery_power
    name: "Battery Control: Total energy charged/discharged"
    unique_id: battery_control_battery_energy
    unit_prefix: k
    unit_time: h
    method: left
    round: 4
    max_sub_interval:
      seconds: 10

template:
  - sensor:
      # A sensor that reflects the current battery charge limit setting, 
      # (if one applies), and is unavailable if there is no limit
      - name: "Battery Control: Current charge limit"
        unique_id: battery_control_charge_limit
        default_entity_id: sensor.battery_control_charge_limit
        unit_of_measurement: "%"
        state_class: measurement
        availability: >
          {{
            (states('input_number.battery_control_charge_limit_manual') | float(100)) < 100
          }}
        state: >
          {{ states('input_number.battery_control_charge_limit_manual') | float }}
        attributes:
          reason: >
            {% set manual = states('input_number.battery_control_charge_limit_manual') | float(100) %}
            {% if manual < 100 %}
              Manual
            {% else %}
              {{ none }}
            {% endif %}

      # A sensor that reflects the current battery charge target setting, 
      # (if one applies), and is unavailable if there is no target
      - name: "Battery Control: Current charge target"
        unique_id: battery_control_charge_target
        default_entity_id: sensor.battery_control_charge_target
        unit_of_measurement: "%"
        state_class: measurement
        availability: >
          {{
            (states('input_number.battery_control_charge_target_manual') | float(0)) > 0
            or
            (
              is_state('binary_sensor.octopus_energy_electricity_19l3390321_1200022336139_off_peak', 'on')
              and (states('input_number.battery_control_charge_target_off_peak') | float(0)) > 0
            )
          }}
        state: >
          {% set manual = states('input_number.battery_control_charge_target_manual') | float(0) %}
          {% if manual > 0 %}
            {{ manual }}
          {% elif is_state('binary_sensor.octopus_energy_electricity_19l3390321_1200022336139_off_peak', 'on') %}
            {{ states('input_number.battery_control_charge_target_off_peak') | float }}
          {% else %}
            {{ 0 }}
          {% endif %}
        attributes:
          reason: >
            {% set manual = states('input_number.battery_control_charge_target_manual') | float(0) %}
            {% if manual > 0 %}
              Manual
            {% elif is_state('binary_sensor.octopus_energy_electricity_19l3390321_1200022336139_off_peak', 'on') %}
              Off-Peak Charge Target
            {% else %}
              {{ none }}
            {% endif %}

      # A sensor that reflects the current prevent-discharging setting.
      - name: "Battery Control: Current \"prevent discharging\" setting"
        unique_id: battery_control_prevent_discharging
        default_entity_id: sensor.battery_control_prevent_discharging
        icon: mdi:battery-lock-outline
        availability: >
          {{ has_value('input_boolean.battery_control_prevent_discharging_manual') }}
        state: >
          {% set manual = is_state('input_boolean.battery_control_prevent_discharging_manual', 'on') %}
          {% set ohme_current = states('sensor.ohme_home_go_current') | float(0) %}
          {{ 'on' if manual or ohme_current > 0 else 'off' }}
        attributes:
          reason: >
            {% set manual = is_state('input_boolean.battery_control_prevent_discharging_manual', 'on') %}
            {% set ohme_current = states('sensor.ohme_home_go_current') | float(0) %}
            {% if manual %}
              Manual
            {% elif ohme_current > 0 %}
              Ohme Charger
            {% else %}
              {{ none }}
            {% endif %}

      # A sensor that reflects the current battery charge mode.
      #
      #   standard       --> (dis-)charge normally (prevent import/export)
      #   charge_blocked --> do not charge above the current limit, but allow discharging
      #   force_charging --> force-charge to the active target. once that target is reached, 
      #                      block discharging to sustain the charge at that level
      #
      #   no_grid        --> grid is unavailable; do not control charging or discharging
      #
      #   From State       | Condition                                   | To State
      #   -----------------+---------------------------------------------+----------------------------
      #   any state        | grid failure                                | no_grid
      #   -----------------+---------------------------------------------+----------------------------
      #   no_grid          | target > 0  and charge <= target            | force_charging
      #                    | limit < 100 and charge >= limit             | charge_blocked
      #                    | otherwise                                   | standard
      #   -----------------+---------------------------------------------+----------------------------
      #   standard         | target > 0  and charge <= target            | force_charging
      #                    | limit < 100 and charge >= limit             | charge_blocked
      #                    | otherwise                                   | remain in standard
      #   -----------------+---------------------------------------------+----------------------------
      #   charge_blocked   | target > 0  and charge <= target            | force_charging
      #                    | charge < (limit - hysteresis)               | standard
      #                    | limit >= 100                                | standard
      #                    | otherwise                                   | remain in charge_blocked
      #   -----------------+---------------------------------------------+----------------------------
      #   force_charging   | target > 0  and charge > target             | standard
      #                    | target <= 0                                 | standard
      #                    | otherwise                                   | remain force_charging
      #
      #   The sequence matters, achieving the charge target takes precedence over the charge limit.
      #
      #   when entering the state "charge_blocked" or "force_charging", charging should continue until
      #   battery_control_charge_[xxxxx]_top_up (in kWh) has been added
      #
      - name: "Battery Control - Current mode"
        unique_id: battery_control_mode
        default_entity_id: sensor.battery_control_mode
        icon: mdi:battery-sync
        availability: >
          {{
            has_value('sensor.victron_gx_dc_battery_charge')
            and has_value('binary_sensor.victron_real_time_off_grid_alarm')
            and has_value('sensor.battery_control_battery_energy')
          }}
        state: >
          {% set previous = this.state %}
          {% set charge = states('sensor.victron_gx_dc_battery_charge') | float %}
          {% set limit = states('sensor.battery_control_charge_limit') | float(100) %}
          {% set target = states('sensor.battery_control_charge_target') | float(0) %}
          {% set hysteresis = states('input_number.battery_control_charge_limit_hysteresis') | float(5) %}

          {% if is_state('binary_sensor.victron_real_time_off_grid_alarm', 'on') %}
            no_grid

          {% elif previous == 'charge_blocked' %}
            {% if target > 0 and charge <= target %}
              force_charging
            {% elif limit >= 100 or charge < (limit - hysteresis) %}
              standard
            {% else %}
              charge_blocked
            {% endif %}

          {% elif previous == 'force_charging' %}
            {% if target > 0 and charge > target %}
              standard
            {% elif target <= 0 %}
              standard
            {% else %}
              force_charging
            {% endif %}

          {% else %}
            {# Covers standard, no_grid after grid restoration, and startup. #}
            {% if target > 0 and charge <= target %}
              force_charging
            {% elif limit < 100 and charge >= limit %}
              charge_blocked
            {% else %}
              standard
            {% endif %}
          {% endif %}
        attributes:
          battery_charge: >
            {{ states('sensor.victron_gx_dc_battery_charge') | int(0) }}
          active_charge_limit: >
            {{ states('sensor.battery_control_charge_limit') | float(100) }}
          active_charge_limit_hysteresis: >
            {{ states('input_number.battery_control_charge_limit_hysteresis') | float(5) }}
          active_charge_target: >
            {{ states('sensor.battery_control_charge_target') | float(0) }}


  # Capture the integrated battery-energy counter whenever the control mode
  # changes to charge-blocked or force_charging. 
  - sensor:
      - name: "Battery Control: Top-up start energy"
        unique_id: battery_control_charge_top_up_start_energy
        default_entity_id: sensor.battery_control_charge_top_up_start_energy
        unit_of_measurement: "kWh"

        # Triggered when the battery control mode changes.
        # Only valid when entering charge_blocked from below
        # or force_charging from below; suppressed if the mode was entered 
        # while battery charge was falling.
        availability: >
          {% set old_charge =
            trigger.from_state.attributes.get('battery_charge')
            if trigger.from_state is not none else none
          %}
          {% set new_charge =
            trigger.to_state.attributes.get('battery_charge')
            if trigger.to_state is not none else none
          %}
          {% set entered_from_below =
            old_charge | is_number
            and new_charge | is_number
            and (new_charge | float) > (old_charge | float)
          %}

          {{
            trigger.id in ['charge_blocked', 'force_charging']
            and entered_from_below
          }}

        # When triggered, save the current energy.
        state: >
          {{ states('sensor.battery_control_battery_energy') | float(0) }}

        attributes:
          mode: "{{ trigger.id }}"

    triggers:
      - trigger: state
        entity_id: sensor.battery_control_mode
        to: "standard"
        id: standard

      - trigger: state
        entity_id: sensor.battery_control_mode
        to: "charge_blocked"
        id: charge_blocked

      - trigger: state
        entity_id: sensor.battery_control_mode
        to: "force_charging"
        id: force_charging

      - trigger: state
        entity_id: sensor.battery_control_mode
        to: "no_grid"
        id: no_grid

  - sensor:
      # Net battery energy added since the current charge_blocked or
      # force_charging mode was entered
      - name: "Battery Control: Top-up energy added"
        unique_id: battery_control_charge_top_up_energy_added
        default_entity_id: sensor.battery_control_charge_top_up_energy_added
        unit_of_measurement: "kWh"

        # Only valid when the mode is charge_blocked or force_charging
        # (indirectly via the start energy sensor)
        availability: >
          {{ has_value('sensor.battery_control_charge_top_up_start_energy')
            and has_value('sensor.battery_control_battery_energy') }}

        state: >
          {% set start_energy =
            states('sensor.battery_control_charge_top_up_start_energy') | float(0)
          %}
          {% set current_energy =
            states('sensor.battery_control_battery_energy') | float(0)
          %}

          {{ max(0, current_energy - start_energy) | round(4) }}

  - binary_sensor:
      # Indicates that the minimum continued-charging energy associated with
      # the current mode entry has not yet been added.
      - name: "Battery Control: Top-up required"
        unique_id: battery_control_charge_top_up_required
        default_entity_id: binary_sensor.battery_control_charge_top_up_required

        availability: >
          {{ has_value('sensor.battery_control_charge_top_up_start_energy')
            and has_value('sensor.battery_control_battery_energy') }}

        state: >
          {% set mode = states('sensor.battery_control_mode') %}
          {% set energy_added =
            states('sensor.battery_control_charge_top_up_energy_added') | float(0)
          %}
          {% set required_energy =
            states(
              'input_number.battery_control_charge_limit_top_up'
              if mode == 'charge_blocked'
              else 'input_number.battery_control_charge_target_top_up'
            ) | float(0)
          %}

          {{ required_energy > 0 and energy_added < required_energy }}

script:
  battery_control_apply:
    alias: "Battery Control: Apply Control Settings to Victron"
    mode: restart

    sequence:
      # Configuration: Variables that are used to control the Victron system. 
      - variables:
          max_charge_current_entity:  number.victron_gx_ess_max_charge_current
          force_charge_entity:        switch.victron_ess_force_charge
          max_discharge_power_entity: number.victron_gx_ess_max_inverter_power_limit

      # Local variables: target values taken from the states / inputs
      - variables:
          desired_mode:          "{{ states('sensor.battery_control_mode') }}"
          battery_charge:        "{{ states('sensor.victron_gx_dc_battery_charge') | float(0) }}"
          charge_target:         "{{ states('sensor.battery_control_charge_target') | float(0) }}"
          top_up_required:       "{{ is_state('binary_sensor.battery_control_charge_top_up_required', 'on') }}"
          prevent_discharging:   "{{ is_state('sensor.battery_control_prevent_discharging', 'on') }}"

      # Pre-entry checks: ensure that the variables are initialised
      # and the required Victron controls are available.
      - condition: state
        entity_id: input_boolean.battery_control_initialised
        state: "on"

      - condition: template
        value_template: >
          {{
            states(max_charge_current_entity) | is_number
            and states(force_charge_entity) in ['on', 'off']
            and states(max_discharge_power_entity) | is_number
          }}

      # Apply the charging mode, taking into account the prevent_discharging settings.
      - choose:
          # No grid: disable forced charging and allow normal discharge.
          - conditions:
              - condition: template
                value_template: "{{ desired_mode == 'no_grid' }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: "{{ force_charge_entity }}"

              - action: number.set_value
                target:
                  entity_id: "{{ max_charge_current_entity }}"
                data:
                  value: -1

              - action: number.set_value
                target:
                  entity_id: "{{ max_discharge_power_entity }}"
                data:
                  value: -1

          # state "charge_blocked":
          # retain normal ESS charging until the required top-up energy (if any)
          # has been added, then prevent further charging. 
          # Discharging follows the overall prevent_discharging setting
          - conditions:
              - condition: template
                value_template: "{{ desired_mode == 'charge_blocked' }}"
            sequence:
              - action: number.set_value
                target:
                  entity_id: "{{ max_charge_current_entity }}"
                data:
                  value: "{{ -1 if top_up_required else 0 }}"

              - action: number.set_value
                target:
                  entity_id: "{{ max_discharge_power_entity }}"
                data:
                  value: "{{ 0 if prevent_discharging else -1 }}"

              - action: switch.turn_off
                target:
                  entity_id: "{{ force_charge_entity }}"

          # state "force_charging":
          # Force inverter to charge and prevent discharging until the
          # target is reached; at the target continue until th requried
          # top-up energy has been added, then stop forced charging
          # discharging is always prevented while in this mode.
          - conditions:
              - condition: template
                value_template: "{{ desired_mode == 'force_charging' }}"
            sequence:
              - action: number.set_value
                target:
                  entity_id: "{{ max_charge_current_entity }}"
                data:
                  value: -1

              - action: number.set_value
                target:
                  entity_id: "{{ max_discharge_power_entity }}"
                data:
                  value: 0

              - if:
                  - condition: template
                    value_template: >
                      {{ battery_charge < charge_target or top_up_required }}
                then:
                  - action: switch.turn_on
                    target:
                      entity_id: "{{ force_charge_entity }}"
                else:
                  - action: switch.turn_off
                    target:
                      entity_id: "{{ force_charge_entity }}"

          # state "standard":
          # normal ESS charging behaviour.
          # Discharging is as per the prevent_discharging setting.
          - conditions:
              - condition: template
                value_template: "{{ desired_mode == 'standard' }}"
            sequence:
              - action: number.set_value
                target:
                  entity_id: "{{ max_charge_current_entity }}"
                data:
                  value: -1

              - action: number.set_value
                target:
                  entity_id: "{{ max_discharge_power_entity }}"
                data:
                  value: "{{ 0 if prevent_discharging else -1 }}"

              - action: switch.turn_off
                target:
                  entity_id: "{{ force_charge_entity }}"

        default:
          - stop: >
              Battery control mode is invalid or unavailable:
              {{ desired_mode }}


automation:
  # Initialise the battery control settings to defaults on first startup
  - id: battery_control_initialise
    alias: "Battery Control: Initialise defaults"
    mode: single

    triggers:
      - trigger: homeassistant
        event: start

    actions:
      - condition: state
        entity_id: input_boolean.battery_control_initialised
        state: "off"
        
      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_limit_manual
        data:
          value: 100

      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_target_manual
        data:
          value: 0

      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_target_off_peak
        data:
          value: 50

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.battery_control_prevent_discharging_manual

      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_limit_hysteresis
        data:
          value: 5

      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_limit_top_up
        data:
          value: 0.2

      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_target_top_up
        data:
          value: 0.2

      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.battery_control_initialised


  - id: battery_control_apply_to_victron
    alias: "Battery Control: Apply Control Settings to Victron"
    mode: restart

    triggers:
      - trigger: state
        to: ~
        entity_id:
          - sensor.battery_control_mode
          - sensor.battery_control_prevent_discharging
          - sensor.victron_gx_dc_battery_charge
          - binary_sensor.battery_control_charge_top_up_required
          - input_boolean.battery_control_initialised

      - trigger: time_pattern
        minutes: "/1"

      - trigger: homeassistant
        event: start

      - trigger: template
        value_template: >
          {{
            states('number.victron_gx_ess_max_charge_current') | is_number
            and states('switch.victron_ess_force_charge') in ['on', 'off']
            and states(
              'number.victron_gx_ess_max_inverter_power_limit'
            ) | is_number
          }}

    actions:
      - condition: state
        entity_id: input_boolean.battery_control_initialised
        state: "on"

      - action: script.battery_control_apply
