# Home assitant package: Controller for battery charge / discharge control.
#
# Normally, the Inverter is set to charge and discharge the battery so there is zero import or export
# of power from the grid.
#
# This packages allows the user to set 
#   - a minimum battery charge level, below which the inverter will be forced to charge the battery 
#     at maximum rate (from all sources including the grid)
#     This can be used to charge the battery during cheaper tariff periods
#
#   - a maximum battery charge level, above which charging will be disabled 
#     This can be used to keep the battery below 100% to preserve battery life or to preserve
#     charging headroom to absorb a spike when the grid fails
#
#   - a "do not discharge" flag that, if set, will prevent the inverter from discharging the battery at all, 
#     even if the battery is above the minimum charge level. This can be used to prevent excessive battery 
#     use by high-power consumers such as an EV charger

# packages/battery_control.yaml

input_number:
  battery_control_charge_limit_manual:
    name: "Battery control: charge limit setting"
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:battery-lock

  battery_control_charge_target_manual:
    name: "Battery control: charge target setting"
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:battery-charging

  battery_control_charge_target_off_peak:
    name: "Battery control: off-peak charge target"
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:battery-charging-10

  battery_control_charge_limit_hysteresis:
    name: "Battery control: charge limit hysteresis"
    min: 0
    max: 20
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:swap-vertical

  battery_control_charge_limit_additional_energy:
    name: "Battery control: additional energy added after reaching charge limit"
    min: 0
    max: 1.0
    step: 0.1
    mode: slider
    unit_of_measurement: "kWh"
    icon: mdi:swap-vertical

  battery_control_charge_target_additional_energy:
    name: "Battery control: additional energy added after reaching charge target"
    min: 0
    max: 1.0
    step: 0.1
    mode: slider
    unit_of_measurement: "kWh"
    icon: mdi:swap-vertical

input_boolean:
  battery_control_prevent_discharging_manual:
    name: Battery control prevent discharging setting
    icon: mdi:battery-lock-outline

  # Internal: ensures defaults are only applied once.
  battery_control_initialised:
    name: Battery control initialised
    icon: mdi:cog-check

sensor:
  # Signed battery energy flow: + for energy charged, - for energy discharging
  # 10 second integration interval is fast enough because the control variable
  # (batttery charge) changes in minutes (order of magnitude)
  - platform: integration
    source: sensor.victron_real_time_battery_power
    name: Battery Control Battery Energy
    unique_id: battery_control_battery_energy
    unit_prefix: k
    unit_time: h
    method: left
    round: 4
    max_sub_interval:
      seconds: 10

template:
  - sensor:
      # A sensor that reflects the current battery charge limit setting, 
      # (if one applies), and is unavailable if there is no limit
      - name: Battery Control Charge Limit
        unique_id: battery_control_charge_limit
        default_entity_id: sensor.battery_control_charge_limit
        unit_of_measurement: "%"
        state_class: measurement
        availability: >
          {{
            (states('input_number.battery_control_charge_limit_manual') | float(100)) < 100
          }}
        state: >
          {{ states('input_number.battery_control_charge_limit_manual') | float }}
        attributes:
          reason: >
            {% set manual = states('input_number.battery_control_charge_limit_manual') | float(100) %}
            {% if manual < 100 %}
              Manual
            {% else %}
              {{ none }}
            {% endif %}

      # A sensor that reflects the current battery charge target setting, 
      # (if one applies), and is unavailable if there is no target
      - name: Battery Control Charge Target
        unique_id: battery_control_charge_target
        default_entity_id: sensor.battery_control_charge_target
        unit_of_measurement: "%"
        state_class: measurement
        availability: >
          {{
            (states('input_number.battery_control_charge_target_manual') | float(0)) > 0
            or
            (
              is_state('binary_sensor.octopus_energy_electricity_19l3390321_1200022336139_off_peak', 'on')
              and (states('input_number.battery_control_charge_target_off_peak') | float(0)) > 0
            )
          }}
        state: >
          {% set manual = states('input_number.battery_control_charge_target_manual') | float(0) %}
          {% if manual > 0 %}
            {{ manual }}
          {% elif is_state('binary_sensor.octopus_energy_electricity_19l3390321_1200022336139_off_peak', 'on') %}
            {{ states('input_number.battery_control_charge_target_off_peak') | float }}
          {% else %}
            {{ 0 }}
          {% endif %}
        attributes:
          reason: >
            {% set manual = states('input_number.battery_control_charge_target_manual') | float(0) %}
            {% if manual > 0 %}
              Manual
            {% elif is_state('binary_sensor.octopus_energy_electricity_19l3390321_1200022336139_off_peak', 'on') %}
              Off-Peak Charge Target
            {% else %}
              {{ none }}
            {% endif %}

      # A sensor that reflects the current prevent-discharging setting.
      - name: Battery Control Prevent Discharging
        unique_id: battery_control_prevent_discharging
        default_entity_id: sensor.battery_control_prevent_discharging
        icon: mdi:battery-lock-outline
        availability: >
          {{ has_value('input_boolean.battery_control_prevent_discharging_manual') }}
        state: >
          {% set manual = is_state('input_boolean.battery_control_prevent_discharging_manual', 'on') %}
          {% set ohme_current = states('sensor.ohme_home_go_current') | float(0) %}
          {{ 'on' if manual or ohme_current > 0 else 'off' }}
        attributes:
          reason: >
            {% set manual = is_state('input_boolean.battery_control_prevent_discharging_manual', 'on') %}
            {% set ohme_current = states('sensor.ohme_home_go_current') | float(0) %}
            {% if manual %}
              Manual
            {% elif ohme_current > 0 %}
              Ohme Charger
            {% else %}
              {{ none }}
            {% endif %}

      # A sensor that reflects the current battery charge mode:
      #
      #   standard                 --> (dis-)charge normally (prevent import/export)
      #
      #   charge_blocked_pending   --> continue normal charging until another
      #                                x kWh net has entered the battery (x is configurable), 
      #                                this is then folowed by "charge_blocked"
      #   charge_blocked           --> do not charge
      #
      #   force_charging           --> charge to the active target. once that target is reached, 
      #                                this is followed by "force_charging_finishing"
      #   force_charging_finishing --> continue forced charging until another
      #                                x kWh net has entered the battery (x is configurable)
      #
      #   no_grid                  --> grid is unavailable, do not try to control chargind or discharging
      #
      - name: Battery Control Mode
        unique_id: battery_control_mode
        default_entity_id: sensor.battery_control_mode
        icon: mdi:battery-sync
        availability: >
          {{
            has_value('sensor.victron_gx_dc_battery_charge')
            and has_value('binary_sensor.victron_real_time_off_grid_alarm')
            and has_value('sensor.battery_control_battery_energy')
          }}
        state: >
          {% set no_grid          = is_state('binary_sensor.victron_real_time_off_grid_alarm', 'on') %}
          {% set charge           = states('sensor.victron_gx_dc_battery_charge') | float %}
          {% set limit            = states('sensor.battery_control_charge_limit') | float(100) %}
          {% set target           = states('sensor.battery_control_charge_target') | float(0) %}
          {% set hysteresis       = states('input_number.battery_control_charge_limit_hysteresis') | float(5) %}
          {% set energy           = states('sensor.battery_control_battery_energy') | float %}
          {% set start_energy     = this.attributes.get('charge_overrun_start_energy', energy) | float(energy) %}
          {% set energy_added     = energy - start_energy %}
          {% set pending          = this.state == 'charge_blocked_pending' %}
          {% set target_finishing = this.state == 'force_charging_finishing' %}
          {% set remain_blocked   = this.state == 'charge_blocked' and charge > (limit - hysteresis) %}

          {% if no_grid %}
            no_grid
          {% elif pending and (limit >= 100 or charge < limit) %}
            standard
          {% elif pending and energy_added < states('input_number.battery_control_charge_limit_additional_energy') | float(0.2) %}
            charge_blocked_pending
          {% elif pending %}
            charge_blocked
          {% elif limit < 100 and remain_blocked %}
            charge_blocked
          {% elif limit < 100 and charge >= limit %}
            charge_blocked_pending
          {% elif target_finishing and target <= 0 %}
            standard
          {% elif target_finishing and charge < target %}
            force_charging
          {% elif target_finishing and energy_added < states('input_number.battery_control_charge_target_additional_energy') | float(0.2) %}
            force_charging_finishing
          {% elif target_finishing %}
            standard
          {% elif target > 0 and charge < target %}
            force_charging
          {% elif target > 0 and this.state == 'force_charging' and charge >= target %}
            force_charging_finishing
          {% else %}
            standard
          {% endif %}
        attributes:
          effective_charge_limit: >
            {{ states('sensor.battery_control_charge_limit') | float(100) }}
          effective_charge_limit_hysteresis: >
            {{ states('input_number.battery_control_charge_limit_hysteresis') | float(5) }}
          effective_charge_target: >
            {{ states('sensor.battery_control_charge_target') | float(0) }}
          charge_overrun_start_energy: >
            {% set energy = states('sensor.battery_control_battery_energy') | float(0) %}
            {% set charge = states('sensor.victron_gx_dc_battery_charge') | float(0) %}
            {% set limit = states('sensor.battery_control_charge_limit') | float(100) %}
            {% set entering_limit_overrun =
              limit < 100
              and charge >= limit
              and this.state not in ['charge_blocked_pending', 'charge_blocked']
            %}
            {% if entering_limit_overrun %}
              {{ energy }}
            {% elif this.state in ['charge_blocked_pending', 'charge_blocked', 'force_charging_finishing'] %}
              {{ this.attributes.get('charge_overrun_start_energy', energy) | float(energy) }}
            {% else %}
              {{ energy }}
            {% endif %}
          charge_overrun_energy_added: >
            {% set energy = states('sensor.battery_control_battery_energy') | float(0) %}
            {% set start = this.attributes.get('charge_overrun_start_energy', energy) | float(energy) %}
            {% if this.state in ['charge_blocked_pending', 'charge_blocked', 'force_charging_finishing'] %}
              {{ (energy - start) | round(4) }}
            {% else %}
              0
            {% endif %}

script:
  battery_control_apply:
    alias: Battery control - apply Victron settings
    mode: restart

    sequence:
      # Configuration: Variables that are used to control the Victron system. 
      - variables:
          max_charge_current_entity:  number.victron_gx_ess_max_charge_current
          force_charge_entity:        switch.victron_ess_force_charge
          max_discharge_power_entity: number.victron_gx_ess_max_inverter_power_limit

      # Local variables: target values taken from the states / inputs
      - variables:
          desired_mode:          "{{ states('sensor.battery_control_mode') }}"
          battery_charge:        "{{ states('sensor.victron_gx_dc_battery_charge') | float(0) }}"
          charge_target:         "{{ states('sensor.battery_control_charge_target') | float(0) }}"
          prevent_discharging:   "{{ is_state('sensor.battery_control_prevent_discharging', 'on') }}"

      # Pre-entry checks: ensure that the variables are initialised
      # and the required Victron controls are available.
      - condition: state
        entity_id: input_boolean.battery_control_initialised
        state: "on"

      - condition: template
        value_template: >
          {{
            states(max_charge_current_entity) | is_number
            and states(force_charge_entity) in ['on', 'off']
            and states(max_discharge_power_entity) | is_number
          }}

      # Apply the charging mode, taking into account the prevent_discharging settings.
      - choose:
          # No grid: disable forced charging and allow normal discharge.
          - conditions:
              - condition: template
                value_template: "{{ desired_mode == 'no_grid' }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: "{{ force_charge_entity }}"

              - action: number.set_value
                target:
                  entity_id: "{{ max_charge_current_entity }}"
                data:
                  value: -1

              - action: number.set_value
                target:
                  entity_id: "{{ max_discharge_power_entity }}"
                data:
                  value: -1

          # At or above the charge limit: prevent charging. 
          # Discharging is as per the prevent_discharging setting.
          - conditions:
              - condition: template
                value_template: "{{ desired_mode == 'charge_blocked' }}"
            sequence:
              - action: number.set_value
                target:
                  entity_id: "{{ max_charge_current_entity }}"
                data:
                  value: 0

              - action: number.set_value
                target:
                  entity_id: "{{ max_discharge_power_entity }}"
                data:
                  value: "{{ 0 if prevent_discharging else -1 }}"

              - action: switch.turn_off
                target:
                  entity_id: "{{ force_charge_entity }}"

          # Below the charge target, or while accumulating the configured
          # charge-target overrun: charge at maximum and prevent discharging.
          - conditions:
              - condition: template
                value_template: >
                  {{ desired_mode in ['force_charging', 'force_charging_finishing'] }}
            sequence:
              - action: number.set_value
                target:
                  entity_id: "{{ max_charge_current_entity }}"
                data:
                  value: -1

              - action: number.set_value
                target:
                  entity_id: "{{ max_discharge_power_entity }}"
                data:
                  value: 0

              - if:
                  - condition: template
                    value_template: >
                      {{ desired_mode == 'force_charging_finishing' or battery_charge < charge_target }}
                then:
                  - action: switch.turn_on
                    target:
                      entity_id: "{{ force_charge_entity }}"
                else:
                  - action: switch.turn_off
                    target:
                      entity_id: "{{ force_charge_entity }}"

          # Between target and limit, or while accumulating the configured
          # charge-limit overrun: normal ESS charging behaviour.
          # Discharging is as per the prevent_discharging setting.
          - conditions:
              - condition: template
                value_template: >
                  {{ desired_mode in ['standard', 'charge_blocked_pending'] }}
            sequence:
              - action: number.set_value
                target:
                  entity_id: "{{ max_charge_current_entity }}"
                data:
                  value: -1

              - action: number.set_value
                target:
                  entity_id: "{{ max_discharge_power_entity }}"
                data:
                  value: "{{ 0 if prevent_discharging else -1 }}"

              - action: switch.turn_off
                target:
                  entity_id: "{{ force_charge_entity }}"

        default:
          - stop: >
              Battery control mode is invalid or unavailable:
              {{ desired_mode }}


automation:
  # Initialise the battery control settings to defaults on first startup
  - id: battery_control_initialise
    alias: Battery control - initialise defaults
    mode: single

    triggers:
      - trigger: homeassistant
        event: start

    actions:
      - condition: state
        entity_id: input_boolean.battery_control_initialised
        state: "off"
        
      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_limit_manual
        data:
          value: 100

      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_target_manual
        data:
          value: 0

      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_target_off_peak
        data:
          value: 50

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.battery_control_prevent_discharging_manual

      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_limit_hysteresis
        data:
          value: 5

      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_limit_additional_energy
        data:
          value: 0.2

      - action: input_number.set_value
        target:
          entity_id: input_number.battery_control_charge_target_additional_energy
        data:
          value: 0.2

      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.battery_control_initialised


  - id: battery_control_apply_to_victron
    alias: Battery Control - Apply Control Settings to Victron
    mode: restart

    triggers:
      - trigger: state
        entity_id:
          - sensor.battery_control_mode
          - sensor.battery_control_prevent_discharging
          - sensor.victron_gx_dc_battery_charge
          - input_boolean.battery_control_initialised

      - trigger: time_pattern
        minutes: "/1"

      - trigger: homeassistant
        event: start

      - trigger: template
        value_template: >
          {{
            states('number.victron_gx_ess_max_charge_current') | is_number
            and states('switch.victron_ess_force_charge') in ['on', 'off']
            and states(
              'number.victron_gx_ess_max_inverter_power_limit'
            ) | is_number
          }}

    actions:
      - condition: state
        entity_id: input_boolean.battery_control_initialised
        state: "on"

      - action: script.battery_control_apply
