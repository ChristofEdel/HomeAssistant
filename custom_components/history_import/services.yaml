import:
  name: Sensor history data import
  description: Import historical sensor states from CSV for a particular sensor into both detailed sensor state history.
  fields:
    entity:
      name: Entity
      description: Sensor whose history is to be imported.
      required: true
      selector:
        entity:
          filter:
            - domain: sensor
    time_zone:
      name: Time zone
      description: Time zone used for timestamps that do not have an explicit time zone specified in the CSV file
      required: true
      default: UTC
      selector:
        select:
          options:
            - label: UTC
              value: UTC
            - label: Local
              value: local
          mode: dropdown
    file:
      name: File
      description: CSV file. First column is timestamp, second column is value. Path relative to /config
      required: true
      selector:
        text:
    import_mode:
      name: Existing States
      description: How existing Recorder states are treated.
      required: true
      selector:
        select:
          options:
            - label: Append To
              value: append
            - label: Overwrite
              value: overwrite
            - label: Replace
              value: replace
          mode: dropdown

recalculate:
  name: Recalculate Sensor Statistics
  description: Delete all existing short and long term statistics and recalculate them from the complete Recorder state history. Only measurement sensors are supported.
  fields:
    entity:
      name: Sensor
      description: Measurement sensor whose statistics are to be recalculated.
      required: true
      selector:
        entity:
          filter:
            - domain: sensor

copy:
  name: Copy Sensor Records
  description: Delete all Recorder history and statistics for the target sensor and replace them with copies of the source sensor records.
  fields:
    sensor_from:
      name: Sensor From
      description: Source sensor. Supports measurement, total and total_increasing state classes.
      required: true
      selector:
        entity:
          filter:
            - domain: sensor
    sensor_to:
      name: Sensor To
      description: Target sensor. Supports measurement, total and total_increasing state classes.
      required: true
      selector:
        entity:
          filter:
            - domain: sensor

reintegrate:
  name: Reintegrate Sensor
  description: Delete all Recorder history and statistics for an Integral integration sensor and rebuild them from the complete Recorder history of its configured source using the Integral sensor's configured method, rounding, units and max sub interval.
  fields:
    entity:
      name: Integration Sensor
      description: Integral integration sensor whose complete history and statistics are to be rebuilt.
      required: true
      selector:
        entity:
          filter:
            - domain: sensor
